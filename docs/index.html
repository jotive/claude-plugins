<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jotive · plugins para Claude Code</title>
<meta name="description" content="Plugins pequeños para Claude Code por Josse.">
<style>
:root{--bg:#faf9f6;--fg:#1c1b19;--muted:#6b6860;--card:#fff;--line:#e6e3dc;--accent:#c4552d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 16px}
h1{font-size:2rem;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 32px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.card h2{margin:0 0 4px;font-size:1.15rem}
.card p{margin:0 0 12px;color:var(--muted)}
code{background:#f0eee8;padding:2px 6px;border-radius:4px;font-size:.9em}
a{color:var(--accent)}
footer{margin-top:40px;color:var(--muted);font-size:.875rem}
</style>
</head>
<body>
<main>
<h1>jotive</h1>
<p class="lead">Plugins pequeños para Claude Code.</p>
<button id="copiar" type="button">Copiar prompt de instalación</button>
<section id="lista"></section>
<footer>
<a href="https://github.com/jotive/claude-plugins">GitHub</a> · MIT · Proyecto independiente, sin afiliación con Anthropic.
</footer>
</main>
<script>
const MARKETPLACE="jotive/claude-plugins";
const PLUGINS=[
{name:"resumen",desc:"Comando /resumen que resume el estado de la sesión en español.",usage:"/resumen"}
];
const lista=document.getElementById("lista");
for(const p of PLUGINS){
const el=document.createElement("article");
el.className="card";
el.innerHTML=`<h2>${p.name}</h2><p>${p.desc}</p><code>${p.usage}</code> · <a href="https://github.com/${MARKETPLACE}/tree/main/plugins/${p.name}">fuente</a>`;
lista.appendChild(el);
}
document.getElementById("copiar").addEventListener("click",async e=>{
const lines=[`Instala estos plugins de Claude Code ejecutando:`,``,`claude plugin marketplace add ${MARKETPLACE}`,...PLUGINS.map(p=>`claude plugin install ${p.name}@jotive`),``,`Luego dime que reinicie Claude Code para que carguen.`];
try{await navigator.clipboard.writeText(lines.join("\n"));e.target.textContent="Copiado"}catch{e.target.textContent="No se pudo copiar"}
});
</script>
</body>
</html>
